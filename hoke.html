    <style>
      /*
       * グループレッスンホケホケ 生徒（保護者）ページ（w21）。
       * 静的ページだけ（GAS の画面は無い）。tools/build-site.mjs が site/hoke.html にし、橋渡し（site-shim）を埋め込む。
       * 家庭の合言葉は URL の ?s=（window.__luce.s）。データは GAS の JSON API（api=hokeParent…）から。
       * 見た目は講師ページ（status.html の w20）と同じ luce 調。絵は luce-page の img/
       */
      :root {
        --ground: #fbf8f5; --surface: #ffffff; --ink: #2b2a28; --muted: #7a7670; --rule: #ece7e1;
        --accent: #0e9ea6; --accent-soft: #e2f3f4; --warn: #bf2a82; --warn-soft: #f7e3ee;
        --caution: #b5652b; --caution-soft: #fbe9e0; --ok: #308639; --ok-soft: #e4f2e6;
        --pink: #ffd7dd; --pink-ink: #8a4a58; --pu: #833cd5; --pu-soft: #eee6f8; --co: #e08256;
        --shadow: 0 1px 2px rgba(60,40,30,.05), 0 10px 26px -18px rgba(60,40,30,.35);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Zen Maru Gothic", -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 16px; line-height: 1.6; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 0 12px 40px; }
      header.hdr { position: relative; display: flex; align-items: flex-end; gap: 12px; margin: 0 -12px; padding: 40px 16px 14px; min-height: 150px; overflow: hidden;
        background: var(--pink) url(https://nulu-luce.github.io/luce-page/img/header.webp) right -200px top 32% / 520px auto no-repeat; }
      header.hdr::after { content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(90deg, var(--pink) 0%, var(--pink) 40%, rgba(255,215,221,.45) 100%), linear-gradient(180deg, rgba(255,215,221,0) 50%, var(--pink) 100%); }
      header.hdr > * { position: relative; z-index: 1; }
      .hdr .logo { width: 64px; height: 64px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 2px 8px rgba(120,60,70,.18); }
      .hdr .logo img { width: 58px; height: 58px; display: block; }
      .hdr .hello { color: var(--pink-ink); padding-right: 118px; min-width: 0; }
      .hdr .hello .name { font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif; font-weight: 600; font-size: 21px; line-height: 1.25; }
      .hdr .hello .name .g { display: block; font-size: 13px; font-weight: 500; letter-spacing: .04em; }
      .hdr .hello .sub { font-size: 13px; opacity: .85; margin-top: 2px; }
      .hdr .hello .sub .n { white-space: nowrap; }
      .hdr .comp { position: absolute; right: 8px; bottom: 10px; height: 96px; width: auto; z-index: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.08)); }
      .confetti { height: 14px; margin: 0 -12px 14px; background: url(https://nulu-luce.github.io/luce-page/img/confetti.webp) center / 420px auto repeat-x; opacity: .55; }
      .card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; position: relative; margin-bottom: 14px; }
      .card h2 { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; margin: 0 0 6px; }
      .card h2::before { content: ""; width: 7px; height: 20px; border-radius: 3px; transform: rotate(-12deg); background: var(--pu); flex: none; }
      .card:nth-child(3n+2) h2::before { background: var(--accent); }
      .card:nth-child(3n+3) h2::before { background: var(--co); }
      .card h2 small { color: var(--muted); font-size: 12.5px; font-weight: 400; margin-left: 4px; }
      .meta { color: var(--muted); font-size: 13.5px; }
      .banner { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; white-space: pre-wrap; }
      .banner.err { background: var(--warn-soft); color: var(--warn); }
      .banner.ok { background: var(--ok-soft); color: var(--ok); }
      .center { text-align: center; color: var(--muted); padding: 24px 0; }
      .kid .cls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 14px; margin-bottom: 8px; }
      .hcourse { font-size: 12px; padding: 1px 9px 1px 26px; border-radius: 999px; background: var(--ok-soft) 5px center / 18px auto no-repeat; color: var(--ok); white-space: nowrap; }
      .hcourse.c-ninjin { background-image: url(https://nulu-luce.github.io/luce-page/img/veg_ninjin.webp); background-color: var(--caution-soft); color: var(--co); }
      .hcourse.c-oimo { background-image: url(https://nulu-luce.github.io/luce-page/img/veg_oimo.webp); background-color: var(--caution-soft); color: #9a5a2a; }
      .hcourse.c-kabocha { background-image: url(https://nulu-luce.github.io/luce-page/img/veg_kabocha.webp); background-color: #fff3d6; color: #9a6a12; }
      .hcourse.c-negi { background-image: url(https://nulu-luce.github.io/luce-page/img/veg_negi.webp); }
      .hcourse.c-serori { background-image: url(https://nulu-luce.github.io/luce-page/img/veg_serori.webp); }
      .rights { background: var(--pu-soft); border-radius: 12px; padding: 8px 12px; margin: 0 0 8px; font-size: 14px; }
      .rights .hr { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 4px; }
      .pick { border: 1.5px solid var(--pu); border-radius: 12px; padding: 8px 12px; margin: 6px 0 10px; font-size: 14px; }
      .cand { display: flex; justify-content: space-between; align-items: center; gap: 6px; border-top: 1px solid var(--rule); padding: 6px 0; }
      .row { display: grid; grid-template-columns: 4.2em 1fr; gap: 2px 10px; align-items: start; padding: 8px 0; border-top: 1px dashed var(--rule); }
      .row:first-of-type { border-top: 0; }
      .row .d { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
      .row .d small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; }
      .row.past .d { color: var(--muted); }
      .row .t { font-variant-numeric: tabular-nums; }
      .row .st { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; margin-left: 4px; background: var(--ground); color: var(--muted); white-space: nowrap; vertical-align: middle; }
      .row .st.plan { background: var(--ok-soft); color: var(--ok); }
      .row .st.abs { background: var(--caution-soft); color: var(--caution); }
      .row .st.mv { background: var(--pu-soft); color: var(--pu); }
      .row .st.ng { background: var(--warn-soft); color: var(--warn); }
      .row .note { font-size: 12.5px; color: var(--muted); }
      .row .acts { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; }
      .hb { font: inherit; font-family: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1.5px solid var(--pu); background: var(--surface); color: var(--pu); white-space: nowrap; }
      .hb.p { background: var(--pu); color: #fff; font-weight: 700; }
      .hb.no { border-color: var(--caution); color: var(--caution); }
      .hb:disabled { opacity: .5; }
      details.past { margin-top: 8px; }
      details.past summary { color: var(--muted); font-size: 13.5px; cursor: pointer; }
      .rules { font-size: 13.5px; }
      .rules li { margin: 4px 0; }
      .foot { margin-top: 26px; text-align: center; }
      .foot .poem { font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif; font-size: 14px; letter-spacing: .12em; color: var(--muted); }
      .foot .v { font-size: 11px; color: var(--muted); }
      .reload { font: inherit; font-family: inherit; border-radius: 999px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface); padding: 6px 14px; font-weight: 700; }
      button:focus-visible { outline: 2px solid var(--pu); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hdr">
        <div class="logo"><img src="https://nulu-luce.github.io/luce-page/img/logo.webp" alt="luce"></div>
        <div class="hello"><div class="name"><span class="g">グループレッスン</span>ホケホケ</div><div class="sub" id="hsub">生徒ページ</div></div>
        <img class="comp" src="https://nulu-luce.github.io/luce-page/img/hoke01.webp" alt="">
      </header>
      <div class="confetti"></div>
      <div id="main"><div class="center">読み込み中…</div></div>
      <div class="foot" id="foot"></div>
    </div>

    <script>
/*
 * luce 講師ページ（静的版）の橋渡し。tools/build-site.mjs が各ページの先頭に埋め込む。
 *
 * GAS の画面では google.script.run でサーバーの関数を呼ぶ。静的ページには google.script が無いので、
 * 同じ形のものをここで作り、中では GAS の JSON API（40_Api.js）を fetch で呼ぶ。
 * 別ドメインからの fetch には Google の Cookie が付かない（credentials: 'omit'）ので、
 * ブラウザがどのアカウントにログインしていても関係なく動く。
 *
 * https://script.google.com/macros/s/AKfycbxDM30NCEgTMLrWZ1Z3muR9gg2JWF3_mK1AVsKL-nW5gyFKnY0x2fmrvEK6FIBxtcfQ/exec はビルド時に 00_Config.js の WEBAPP_URL に置き換わる。
 * 画面のコード（status.html / events.html）は GAS 版と同じものをそのまま使う。
 */
(function (w) {
  var API_URL = 'https://script.google.com/macros/s/AKfycbxDM30NCEgTMLrWZ1Z3muR9gg2JWF3_mK1AVsKL-nW5gyFKnY0x2fmrvEK6FIBxtcfQ/exec';

  function parseQuery(search) {
    var out = {};
    String(search || '').replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      try { k = decodeURIComponent(k.replace(/\+/g, ' ')); } catch (err) { /* そのまま */ }
      try { v = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (err) { /* そのまま */ }
      if (k) out[k] = v;
    });
    return out;
  }

  function toQuery(params) {
    var p = params || {};
    return Object.keys(p).filter(function (k) { return p[k] !== undefined && p[k] !== null && p[k] !== ''; })
      .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(String(p[k])); })
      .join('&');
  }

  var q = parseQuery(w.location && w.location.search);
  // token は先生の合言葉（?t=）、s は生徒ページ（ホケホケ）の家庭の合言葉（?s=。w21）
  w.__luce = { token: q.t || '', no: q.no || '', s: q.s || '', apiUrl: API_URL, parseQuery: parseQuery, toQuery: toQuery };

  function finish(promise, ok, ng) {
    promise
      .then(function (res) { return res.json(); })
      .then(function (body) {
        if (body && body.ok) ok(body.data);
        else ng(new Error((body && body.error) || '応答が読めませんでした'));
      }, function (err) {
        var why = err && err.message ? err.message : String(err);
        ng(new Error('通信に失敗しました。電波の良いところでもう一度お試しください（' + why + '）'));
      });
  }

  function get(params, ok, ng) {
    finish(w.fetch(API_URL + '?' + toQuery(params), { method: 'GET', credentials: 'omit', cache: 'no-store' }), ok, ng);
  }

  function post(body, ok, ng) {
    // Content-Type を text/plain にすると preflight（OPTIONS）が飛ばない。GAS は OPTIONS に答えられない
    finish(w.fetch(API_URL, {
      method: 'POST', credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }), ok, ng);
  }

  /** google.script.run と同じ形。呼ぶたびに新しいものを返す（ハンドラが次の呼び出しに残らない） */
  function runner() {
    var ok = function () {};
    var ng = function (err) { if (w.console && w.console.error) w.console.error(err); };
    var r = {
      withSuccessHandler: function (f) { ok = f; return r; },
      withFailureHandler: function (f) { ng = f; return r; },
      withUserObject: function () { return r; },
      getStatusPage: function (p) { get({ api: 'status', t: p && p.t, no: p && p.no, fresh: p && p.fresh ? '1' : '' }, ok, ng); },
      getEventPage: function (p) { get({ api: 'events', t: p && p.t }, ok, ng); },
      saveEventAnswer: function (eventId, answer, comment, p) {
        post({ api: 'saveEventAnswer', t: p && p.t, eventId: eventId, answer: answer, comment: comment }, ok, ng);
      },
      saveStudentAnswers: function (eventId, rows, noStudents, p) {
        post({ api: 'saveStudentAnswers', t: p && p.t, eventId: eventId, rows: rows || [], noStudents: !!noStudents }, ok, ng);
      },
      // w7: ホーム
      getHomePage: function (p) { get({ api: 'home', t: p && p.t, no: p && p.no }, ok, ng); },
      markTaskDone: function (taskId, p) { post({ api: 'markTaskDone', t: p && p.t, no: p && p.no, taskId: taskId }, ok, ng); },
      askQuestion: function (text, p) { post({ api: 'askQuestion', t: p && p.t, no: p && p.no, text: text }, ok, ng); },
      // w10: 部屋の空き
      getRoomsPage: function (p) { get({ api: 'rooms', t: p && p.t, no: p && p.no, campus: p && p.campus }, ok, ng); },
      // w11: 振替・予約の申請
      submitRequest: function (input, p) { post({ api: 'submitRequest', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      cancelRequest: function (id, reason, p) { post({ api: 'cancelRequest', t: p && p.t, no: p && p.no, id: id, reason: reason || '' }, ok, ng); },
      decideRequest: function (id, decision, comment, force, p) { post({ api: 'decideRequest', t: p && p.t, no: p && p.no, id: id, decision: decision, comment: comment || '', force: !!force }, ok, ng); },
      // w12: レッスン記録
      saveRecord: function (input, p) { post({ api: 'saveRecord', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      deleteRecord: function (input, p) { post({ api: 'deleteRecord', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      // w26: 今月の記録の確定
      confirmRecords: function (input, p) { post({ api: 'confirmRecords', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      // w31: 現金の受け取り
      saveCashReceipt: function (input, p) { post({ api: 'saveCashReceipt', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      // w33: 締めチェック（管理者）
      setChecklistItem: function (input, p) { post({ api: 'setChecklistItem', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      // w27: 全先生の今月（管理者）
      getAllTeachersPage: function (p) { get({ api: 'allTeachers', t: p && p.t, no: p && p.no }, ok, ng); },
      // w29: 担当生徒の登録内容と「違う」
      getRosterPage: function (p) { get({ api: 'roster', t: p && p.t, no: p && p.no }, ok, ng); },
      reportRosterIssue: function (input, p) { post({ api: 'reportRosterIssue', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      // w14: 管理者が質問に返す
      answerQuestion: function (row, at, qno, text, p) { post({ api: 'answerQuestion', t: p && p.t, no: p && p.no, row: row, at: at, qno: qno, text: text }, ok, ng); },
      // w17: ホケホケ
      getHokePage: function (p) { get({ api: 'hoke', t: p && p.t, no: p && p.no, week: p && p.week }, ok, ng); },
      hokeCandidates: function (rightId, p) { get({ api: 'hokeCandidates', t: p && p.t, no: p && p.no, rightId: rightId, past: p && p.past ? '1' : '' }, ok, ng); },
      hokeSetState: function (input, p) { post({ api: 'hokeSetState', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      hokeMove: function (input, p) { post({ api: 'hokeMove', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      hokeAdd: function (input, p) { post({ api: 'hokeAdd', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      hokeCancel: function (input, p) { post({ api: 'hokeCancel', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      hokeClose: function (input, p) { post({ api: 'hokeClose', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      // w21: ホケホケの生徒ページ（家庭の合言葉 s）
      getHokeParentPage: function (p) { get({ api: 'hokeParent', s: p && p.s }, ok, ng); },
      hokeParentCandidates: function (rightId, p) { get({ api: 'hokeParentCandidates', s: p && p.s, rightId: rightId }, ok, ng); },
      hokeParentAbsent: function (input, p) { post({ api: 'hokeParentAbsent', s: p && p.s, input: input || {} }, ok, ng); },
      hokeParentUndo: function (input, p) { post({ api: 'hokeParentUndo', s: p && p.s, input: input || {} }, ok, ng); },
      hokeParentMove: function (input, p) { post({ api: 'hokeParentMove', s: p && p.s, input: input || {} }, ok, ng); },
      hokeParentCancel: function (input, p) { post({ api: 'hokeParentCancel', s: p && p.s, input: input || {} }, ok, ng); }
    };
    return r;
  }

  function replaceUrl(mode, state, params, hash) {
    try {
      w.history[mode](state || null, '', '?' + toQuery(params) + (hash ? '#' + hash : ''));
    } catch (err) { /* 古いブラウザ */ }
  }

  var script = {
    url: {
      getLocation: function (cb) {
        cb({ parameter: parseQuery(w.location && w.location.search), parameters: {}, hash: '' });
      }
    },
    history: {
      replace: function (state, params, hash) { replaceUrl('replaceState', state, params, hash); },
      push: function (state, params, hash) { replaceUrl('pushState', state, params, hash); },
      setChangeHandler: function () {}
    }
  };
  Object.defineProperty(script, 'run', { get: runner });
  w.google = { script: script };

  /** ページの中のリンク（「イベント →」など）に合言葉を引き継ぐ */
  function keepToken() {
    if (!w.document || !w.document.querySelectorAll) return;
    var as = w.document.querySelectorAll('a[data-keep-token]');
    for (var i = 0; i < as.length; i++) {
      var href = as[i].getAttribute('href') || '';
      as[i].setAttribute('href', href.replace(/[?#].*$/, '') + '?' + toQuery({ t: w.__luce.token }));
    }
  }
  if (w.document && w.document.addEventListener) w.document.addEventListener('DOMContentLoaded', keepToken);
  w.__luce.keepToken = keepToken;
})(window);

    </script>
    <script>
      var S = (window.__luce && window.__luce.s) || '';
      var P = { data: null, loading: true, error: '', pick: null, busy: false, flash: '' };
      var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      };
      function courseClass(c) {
        var m = { 'にんじん': 'ninjin', 'おいも': 'oimo', 'かぼちゃ': 'kabocha', 'ねぎ': 'negi', 'せろり': 'serori', 'セロリ': 'serori' };
        return m[String(c || '').trim()] ? 'c-' + m[String(c || '').trim()] : '';
      }
      function courseHtml(c) { return c ? '<span class="hcourse ' + courseClass(c) + '">' + esc(c) + '</span>' : ''; }

      function render() {
        var el = document.getElementById('main');
        if (P.loading) { el.innerHTML = '<div class="center">読み込み中…</div>'; return; }
        if (P.error) { el.innerHTML = '<div class="banner err">' + esc(P.error) + '</div><div class="center"><button class="reload" onclick="load()">もう一度</button></div>'; return; }
        var d = P.data;
        var html = '';
        if (P.flash) html += '<div class="banner ok">' + esc(P.flash) + '</div>';
        (d.kids || []).forEach(function (k) { html += kidHtml(d, k); });
        html += '<div class="card"><h2>きまりごと</h2><ul class="rules">'
          + '<li>お休みの連絡は<b>前日まで</b>。このページの「お休みする」を押してください。振替できる回が1回つきます</li>'
          + '<li>当日のお休みは「今日お休みする」を押してください。成瀬先生にすぐ知らせが届きます（当日のお休みは振替できません）</li>'
          + '<li>振替は、同じコースの<b>空きのある回</b>から選べます（1回のお休みにつき1回。期限はありません）</li>'
          + '<li>決めた振替は、前日までなら取りやめられます（振替できる回は戻ります）</li>'
          + '<li>1クラス ' + d.cap + '名まで・' + d.min + '分。人数はそのときの空きで変わります</li>'
          + (d.hasMail ? '<li>お休み・振替を決めると、控えのメールが届きます</li>' : '<li>控えのメールは届きません（名簿にメールアドレスの登録がありません）。この画面が控えになります</li>')
          + '</ul><p class="meta">困ったときは成瀬先生（ホケホケの公式LINE）へ。</p></div>';
        el.innerHTML = html;
        var sub = document.getElementById('hsub');
        if (sub) sub.innerHTML = (d.kids || []).map(function (k) { return '<span class="n">' + esc(k.name) + ' さん</span>'; }).join('・') || '生徒ページ';
        var f = document.getElementById('foot');
        if (f) f.innerHTML = '<div class="poem">luceがダメなら他はない</div><div class="v">' + esc(d.version || '') + '</div>';
      }

      function kidHtml(d, k) {
        var h = '<div class="card kid"><h2>' + esc(k.name) + ' さん</h2>';
        h += '<div class="cls"><span>いつもの回: ' + (k.classLabel ? esc(k.classLabel) + (k.endHm ? '〜' + esc(k.endHm) : '') : '（名簿にクラスがありません）') + '</span>' + courseHtml(k.course) + '</div>';
        if (k.rights && k.rights.length) {
          h += '<div class="rights"><b>振替できる回があります</b>（' + k.rights.length + '回）' + k.rights.map(function (r) {
            return '<div class="hr"><span class="meta">' + esc(r.label) + ' のお休みのぶん</span><button class="hb p" onclick="pick(\'' + esc(r.attId) + '\', \'' + esc(k.id) + '\')">振替先を選ぶ</button></div>';
          }).join('') + '</div>';
        }
        if (P.pick && P.pick.kidId === k.id) h += pickHtml();
        var future = k.rows.filter(function (r) { return r.ymd >= d.today; });
        var past = k.rows.filter(function (r) { return r.ymd < d.today; }).reverse();
        if (!future.length) h += '<div class="meta">これからの回はまだありません（8週間先まで）</div>';
        else h += future.map(function (r) { return rowHtml(d, k, r); }).join('');
        if (past.length) h += '<details class="past"><summary>これまで（' + past.length + '回）</summary>' + past.map(function (r) { return rowHtml(d, k, r); }).join('') + '</details>';
        return h + '</div>';
      }

      function stateHtml(d, r) {
        var isPast = r.ymd < d.today, today = r.ymd === d.today;
        if (r.state === '休講' || (r.closed && r.state === '予定')) return '<span class="st">休講</span>';
        if (r.state === '欠席連絡') return '<span class="st abs">お休み連絡済み</span>';
        if (r.state === '振替済み') return '<span class="st mv">振替済み' + (r.movedTo ? '（→ ' + esc(r.movedTo) + '）' : '') + '</span>';
        if (r.state === '出席') return '<span class="st plan">出席</span>';
        if (r.state === '当日欠席') return '<span class="st ng">当日お休み</span>';
        if (r.state === '予定') return isPast ? '<span class="st">終了</span>' : (today ? '<span class="st plan">今日</span>' : '<span class="st plan">参加予定</span>');
        return '<span class="st">' + esc(r.state) + '</span>';
      }

      function rowHtml(d, k, r) {
        var isPast = r.ymd < d.today;
        var q = "'" + esc(k.id) + "','" + r.ymd + "','" + esc(r.classId) + "','" + esc(r.attId) + "'";
        var kind = r.kind !== '基本' ? '<span class="st mv">' + esc(r.kind) + '</span>' : '';
        var h = '<div class="row' + (isPast ? ' past' : '') + '"><div class="d">' + esc(r.label.replace(/\(.*\)$/, '')) + '<small>' + esc((r.label.match(/\((.)\)$/) || ['', ''])[1]) + '曜</small></div><div>'
          + '<span class="t">' + esc(r.hm) + '〜' + esc(r.endHm) + '</span>' + (r.classId !== k.classId ? courseHtml(r.course) : '') + kind + stateHtml(d, r);
        if (r.from) h += '<div class="note">' + esc(r.from) + ' のお休みのぶん</div>';
        var acts = [];
        if (r.can.absent) acts.push('<button class="hb" onclick="absent(' + q + ', \'' + esc(r.label + ' ' + r.hm) + '\')">お休みする</button>');
        if (r.can.absentToday) acts.push('<button class="hb no" onclick="absentToday(' + q + ', \'' + esc(r.label + ' ' + r.hm) + '\')">今日お休みする</button>');
        if (r.can.undo) acts.push('<button class="hb" onclick="undo(' + q + ')">お休みをやめる</button>');
        if (r.can.pick) acts.push('<button class="hb p" onclick="pick(\'' + esc(r.attId) + '\', \'' + esc(k.id) + '\')">振替先を選ぶ</button>');
        if (r.can.cancel) acts.push('<button class="hb no" onclick="cancelRow(' + q + ', \'' + esc(r.kind) + '\')">取りやめる</button>');
        if (acts.length) h += '<div class="acts">' + acts.join('') + '</div>';
        return h + '</div></div>';
      }

      function pickHtml() {
        var p = P.pick;
        var h = '<div class="pick"><b>' + esc(p.right.name || '') + ' さんの振替先</b><div class="meta">' + esc(p.right.label || '') + ' のお休みのぶん' + (p.right.course ? '（' + esc(p.right.course) + ' のコースの回）' : '') + '</div>';
        if (p.loading) h += '<div class="meta">空きを読んでいます…</div>';
        else if (!p.candidates.length) h += '<div class="meta">いま空きのある回がありません（8週間先まで）。しばらくしてからもう一度見るか、成瀬先生にご相談ください</div>';
        else h += p.candidates.map(function (c) {
          return '<div class="cand"><span>' + esc(c.label) + '</span><span class="meta">残り ' + c.free + '席</span><button class="hb p" onclick="move(\'' + esc(p.right.attId) + '\', \'' + c.ymd + '\', \'' + esc(c.classId) + '\', \'' + esc(c.label) + '\')">この回にする</button></div>';
        }).join('');
        return h + '<div style="margin-top:6px"><button class="hb" onclick="P.pick = null; render()">閉じる</button></div></div>';
      }

      function load() {
        P.loading = true; P.error = ''; P.pick = null; render();
        try {
          if (!S) throw new Error('このページはご家庭ごとのリンクから開きます。成瀬先生からもらったリンク（LINE か紙の QR コード）を開いてください');
          google.script.run
            .withSuccessHandler(function (data) { P.loading = false; P.data = data; render(); })
            .withFailureHandler(function (err) { P.loading = false; P.error = err.message; render(); })
            .getHokeParentPage({ s: S });
        } catch (err) { P.loading = false; P.error = err.message; render(); }
      }
      function send(name, input, flash) {
        if (P.busy) return;
        P.busy = true; P.loading = true; P.flash = ''; render();
        google.script.run
          .withSuccessHandler(function (res) { P.busy = false; P.loading = false; P.pick = null; if (res && res.kids) P.data = res; P.flash = flash || ''; render(); window.scrollTo(0, 0); })
          .withFailureHandler(function (err) { P.busy = false; P.loading = false; alert('できませんでした。' + err.message); render(); })
          [name](input, { s: S });
      }
      function absent(kidId, ymd, classId, attId, label) {
        if (!confirm(label + ' をお休みしますか？\n（前日までの連絡なので、振替できる回が1回つきます）')) return;
        send('hokeParentAbsent', { ymd: ymd, classId: classId, studentId: kidId }, 'お休みの連絡を受け付けました。振替は「振替先を選ぶ」からいつでも選べます');
      }
      function absentToday(kidId, ymd, classId, attId, label) {
        // w22: 当日のお休み。振替なし。成瀬先生にすぐメールが届く
        if (!confirm('今日 ' + label + ' のレッスンをお休みしますか？\n当日のお休みなので振替はできません。成瀬先生にすぐ知らせます')) return;
        send('hokeParentAbsent', { ymd: ymd, classId: classId, studentId: kidId }, '今日のお休みを成瀬先生に知らせました（当日のお休みは振替できません）');
      }
      function undo(kidId, ymd, classId, attId) {
        if (!confirm('お休みの連絡を取り消して、参加予定に戻しますか？')) return;
        send('hokeParentUndo', { attId: attId }, '参加予定に戻しました');
      }
      function cancelRow(kidId, ymd, classId, attId, kind) {
        if (!confirm('この' + kind + 'の回を取りやめますか？' + (kind === '振替' ? '（振替できる回は戻ります）' : ''))) return;
        send('hokeParentCancel', { attId: attId }, '取りやめました');
      }
      function move(rightId, ymd, classId, label) {
        if (!confirm(label + ' に振替えますか？')) return;
        send('hokeParentMove', { rightId: rightId, ymd: ymd, classId: classId }, label + ' に振替えました');
      }
      function pick(attId, kidId) {
        var kid = ((P.data || {}).kids || []).filter(function (k) { return k.id === kidId; })[0] || {};
        var r = (kid.rights || []).filter(function (x) { return x.attId === attId; })[0] || { attId: attId, label: '', course: '' };
        P.pick = { kidId: kidId, right: { attId: attId, name: kid.name, label: r.label, course: r.course }, candidates: [], loading: true }; render();
        google.script.run
          .withSuccessHandler(function (res) { P.pick = { kidId: kidId, right: { attId: attId, name: kid.name, label: res.right.label, course: res.right.course }, candidates: res.candidates || [], loading: false }; render(); })
          .withFailureHandler(function (err) { P.pick = null; alert(err.message); render(); })
          .hokeParentCandidates(attId, { s: S });
      }
      load();
    </script>
  </body>
</html>
