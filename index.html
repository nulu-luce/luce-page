<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>luce 講師ページ</title>
    <link rel="apple-touch-icon" sizes="180x180" href="https://nulu-luce.github.io/luce-page/img/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://nulu-luce.github.io/luce-page/img/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="https://nulu-luce.github.io/luce-page/img/icon-512.png" />
    <meta name="apple-mobile-web-app-title" content="luce" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap" />
    <style>
      :root {
        --ground: #f7f7f4;
        --surface: #ffffff;
        --ink: #212726;
        --muted: #64716e;
        --rule: #e3e6e1;
        --accent: #0e9ea6;
        --accent-soft: #e2f3f4;
        --warn: #b3436d;
        --warn-soft: #f6e7ee;
        --caution: #a3620a;
        --caution-soft: #f8efdd;
        --ok: #2f8a3a;
        --ok-soft: #e4f2e6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        font-size: 16px;
        line-height: 1.65;
      }
      .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 48px; }
      header { padding: 6px 2px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      h1 { font-size: 19px; margin: 0; }
      h1 small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
      .who { color: var(--muted); font-size: 12.5px; }
      .nav a { color: var(--accent); font-size: 13px; text-decoration: none; }

      .card {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .card h2 { font-size: 16px; margin: 0 0 6px; }
      .card h2 small { color: var(--muted); font-size: 12.5px; font-weight: 400; margin-left: 6px; }
      .meta { color: var(--muted); font-size: 13.5px; }
      .meta b { color: var(--ink); font-weight: 600; }
      .meta a { color: var(--accent); }

      .banner { border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; white-space: pre-wrap; }
      .banner.err { background: var(--warn-soft); color: var(--warn); }
      .banner.info { background: var(--caution-soft); color: var(--caution); }

      .big { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 8px; }
      .big .yen { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
      .big .lbl { color: var(--muted); font-size: 13px; }

      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
      .chip {
        font-size: 13px; background: var(--ground); border: 1px solid var(--rule);
        border-radius: 8px; padding: 2px 9px; white-space: nowrap;
      }
      .chip b { font-size: 15px; font-variant-numeric: tabular-nums; }
      .chip.err { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
      .chip.warn { background: var(--caution-soft); border-color: transparent; color: var(--caution); }
      .chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

      .done-list { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; margin-top: 4px; }
      .done-list .st { font-size: 12.5px; padding: 0 8px; border-radius: 999px; text-align: center; }
      .st.ok { background: var(--ok-soft); color: var(--ok); }
      .st.no { background: var(--caution-soft); color: var(--caution); }
      .st.none { background: var(--ground); color: var(--muted); }

      .filter { display: flex; gap: 6px; margin: 4px 0 10px; }
      .filter button {
        font-size: 12.5px; padding: 4px 10px; border-radius: 999px; font-family: inherit;
        border: 1px solid var(--rule); background: var(--surface); color: var(--muted);
      }
      .filter button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
      .issue { border-left: 3px solid var(--caution); padding: 6px 10px; margin-bottom: 8px; background: #fbfbf9; border-radius: 0 8px 8px 0; }
      .issue.err { border-left-color: var(--warn); }
      .issue .where { font-size: 12px; color: var(--muted); }
      .issue .where b { color: var(--ink); font-weight: 600; }
      .issue .sev { font-size: 11.5px; padding: 0 6px; border-radius: 999px; margin-right: 6px; }
      .issue.err .sev { background: var(--warn-soft); color: var(--warn); }
      .issue.warn .sev { background: var(--caution-soft); color: var(--caution); }
      .issue .msg { font-size: 14px; white-space: pre-wrap; }
      .issue.hidden { display: none; }
      .empty { color: var(--ok); font-size: 14px; }

      .tbl { overflow-x: auto; margin-top: 6px; }
      table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
      td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: top; }
      th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
      td.r, th.r { text-align: right; }
      td.c, th.c { text-align: center; }
      tr.total td { font-weight: 700; border-top: 2px solid var(--ink); }
      tr.sub td { color: var(--muted); }
      .mark { display: inline-block; width: 18px; text-align: center; }
      .mark.on { color: var(--accent); font-weight: 700; }
      .mark.off { color: #c9cec8; }
      td.name { white-space: normal; min-width: 96px; }
      td.name small { color: var(--muted); font-size: 11.5px; display: block; line-height: 1.3; }

      details { margin-top: 6px; font-size: 14px; }
      details summary { color: var(--accent); cursor: pointer; }
      .hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; white-space: pre-wrap; }

      select {
        font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px;
        border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); max-width: 100%;
      }
      .reload {
        margin-top: 4px; width: 100%; padding: 11px 0; font-size: 15px; font-family: inherit;
        border: 1.5px solid var(--rule); border-radius: 10px; background: var(--surface); color: var(--accent);
      }
      .center { text-align: center; color: var(--muted); padding: 42px 12px; white-space: pre-wrap; }
      .center b { color: var(--ink); }
      .foot { color: var(--muted); font-size: 11.5px; text-align: center; margin-top: 26px; }

      /* w7 ホーム */
      .today { border-color: var(--accent); }
      .room { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; margin: 4px 0; }
      .room b { font-size: 16px; }
      .room .time { font-variant-numeric: tabular-nums; }
      .badge { font-size: 11.5px; padding: 0 7px; border-radius: 999px; background: var(--caution-soft); color: var(--caution); margin-left: 4px; white-space: nowrap; }
      .badge.trial { background: var(--warn-soft); color: var(--warn); }
      .badge.new { background: var(--accent-soft); color: var(--accent); }
      .stu { display: grid; grid-template-columns: 3.6em 1fr auto; gap: 3px 8px; font-size: 14.5px; margin-top: 8px; align-items: baseline; }
      .stu .t { font-variant-numeric: tabular-nums; color: var(--muted); }
      .stu .lv { color: var(--muted); font-size: 12.5px; text-align: right; }
      .week { display: grid; gap: 4px; font-size: 14px; margin-top: 6px; }
      .week .d { display: grid; grid-template-columns: 5.4em 1fr; gap: 6px; }
      .week .d .rest { color: var(--muted); }
      .notice { border-top: 1px solid var(--rule); padding: 8px 0; }
      .notice:first-child { border-top: 0; padding-top: 2px; }
      .notice .dt { font-size: 12px; color: var(--muted); }
      .notice .tt { font-weight: 600; }
      .notice .bd { font-size: 14px; white-space: pre-wrap; }
      .task { display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid var(--rule); padding: 8px 0; }
      .task:first-child { border-top: 0; padding-top: 2px; }
      .task .body { flex: 1; }
      .task .due { font-size: 12.5px; color: var(--muted); }
      .task .due.over { color: var(--warn); font-weight: 600; }
      .task .desc { font-size: 13.5px; white-space: pre-wrap; }
      .task .desc a { color: var(--accent); }
      .task button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); white-space: nowrap; }
      .task .did { font-size: 12.5px; color: var(--ok); white-space: nowrap; }
      textarea { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); min-height: 72px; }
      .send { margin-top: 6px; font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; }
      .send:disabled { opacity: .6; }
      .sent { font-size: 13px; color: var(--ok); margin-top: 6px; }
      .faq details { margin-top: 4px; }
      .faq .a { font-size: 14px; white-space: pre-wrap; color: var(--ink); padding: 4px 0 6px 10px; border-left: 3px solid var(--accent-soft); }

      /* w10 部屋の空き */
      .rchips { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 8px; }
      .rchips button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--muted); }
      .rchips button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
      .rbtn { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); margin-top: 6px; }
      .rbtn:disabled { opacity: .6; }
      .rticks { position: relative; height: 14px; margin-left: 4.4em; font-size: 10.5px; color: var(--muted); }
      .rticks span { position: absolute; transform: translateX(-50%); }
      .rday { border-top: 1px solid var(--rule); padding: 8px 0 2px; }
      .rday:first-child { border-top: 0; padding-top: 2px; }
      .rdate { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
      .rdate.today { color: var(--accent); }
      .rroom { display: grid; grid-template-columns: 4.4em 1fr; gap: 1px 6px; align-items: center; margin-bottom: 7px; }
      .rname { font-size: 13.5px; font-weight: 600; cursor: pointer; }
      .rbar { position: relative; height: 18px; background: var(--ok-soft); border-radius: 4px; overflow: hidden; }
      .seg { position: absolute; top: 0; bottom: 0; font-size: 10.5px; line-height: 18px; padding: 0 4px; overflow: hidden; white-space: nowrap; color: #fff; }
      .seg.lesson { background: var(--accent); }
      .seg.rental { background: var(--caution); }
      .seg.other { background: var(--muted); }
      .rfree { grid-column: 2; font-size: 12.5px; }
      .rfree b { color: var(--ok); font-weight: 600; }
      .rfree.none { color: var(--muted); }
      .rfree.err { color: var(--warn); }
      .rlist { grid-column: 2; font-size: 12.5px; color: var(--muted); }
      .rlegend { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 2px; }
      .rlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }

      /* w11 振替・予約の申請 */
      .badge.move, .badge.book { background: var(--accent-soft); color: var(--accent); }
      .req { border-top: 1px solid var(--rule); padding: 8px 0; display: flex; gap: 8px; align-items: flex-start; }
      .req:first-child { border-top: 0; padding-top: 2px; }
      .req .body { flex: 1; font-size: 14px; }
      .req .sub { font-size: 12.5px; color: var(--muted); }
      .req .st { font-size: 12.5px; white-space: nowrap; }
      .req .st.open { color: var(--caution); } .req .st.ok { color: var(--ok); } .req .st.off { color: var(--muted); }
      .req button, .rform button, .pend button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); }
      .req button.no, .pend button.no { border-color: var(--warn); color: var(--warn); }
      .pend button.p, .rform button.p { background: var(--accent); color: #fff; }
      button:disabled { opacity: .6; }
      .rform { display: grid; gap: 8px; margin-top: 8px; }
      .rform label { font-size: 12.5px; color: var(--muted); display: block; }
      .rform input, .rform select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); width: 100%; }
      .rform .inline { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .rform .pills button { border-radius: 999px; padding: 3px 11px; color: var(--muted); border-color: var(--rule); margin: 0 4px 4px 0; }
      .rform .pills button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
      .rform .freeinfo { font-size: 12.5px; min-height: 1.2em; }
      .rform .freeinfo b { color: var(--ok); }
      .rform .freeinfo.ng { color: var(--warn); }
      .rform .send { justify-self: start; padding: 8px 16px; }
      .pend { border-top: 1px solid var(--rule); padding: 8px 0; font-size: 14px; }
      .pend:first-of-type { border-top: 0; }
      .pend .sub { font-size: 12.5px; color: var(--muted); }
      .pend .chk { font-size: 12.5px; margin: 2px 0; } .pend .chk.ok { color: var(--ok); } .pend .chk.ng { color: var(--warn); }
      .pend .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
      .card.pending { border-color: var(--caution); }

      /* w12 レッスン記録 */
      .stu .rec { grid-column: 2 / 4; margin: -2px 0 6px; }
      .att { display: flex; flex-wrap: wrap; gap: 4px; }
      .att button { font: inherit; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--muted); }
      .att button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
      .att button.on.pay0 { border-color: var(--caution); color: var(--caution); background: var(--caution-soft); }
      .att button:disabled { opacity: .5; }
      .memo { margin-top: 4px; display: flex; gap: 6px; align-items: center; }
      .memo input { flex: 1; font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 8px; border: 1.5px dashed var(--rule); background: var(--surface); color: var(--ink); min-width: 0; }
      .memo input:focus { border-style: solid; border-color: var(--accent); outline: none; }
      .memo .ok { font-size: 11.5px; color: var(--ok); white-space: nowrap; }
      .tnote { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .tnote.none { color: var(--caution); }
      .unrec { background: var(--caution-soft); color: var(--caution); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; margin: 0 0 8px; }
      .pastday { border-top: 1px solid var(--rule); padding: 8px 0 2px; }
      .pastday .pd { font-weight: 600; font-size: 14px; }
      /* w17 ホケホケ */
      .hnav { display: flex; gap: 6px; margin-bottom: 8px; }
      .hnav button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--muted); }
      .hnav button.on { border-color: var(--accent); color: var(--accent); }
      .hrights { background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; font-size: 14px; }
      .hrights .hr { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 4px; }
      .hpick, .hadd { border: 1.5px solid var(--accent); border-radius: 10px; padding: 8px 10px; margin: 6px 0 8px; font-size: 14px; }
      .hcand { display: flex; justify-content: space-between; align-items: center; gap: 6px; border-top: 1px solid var(--rule); padding: 5px 0; }
      .hcand > span:first-child { flex: 1 1 auto; }
      .hcand .meta, .hcand .hb { white-space: nowrap; flex-shrink: 0; }   /* w22: 「残り n席」「済んだ回」を縦に折らない */
      .hday { margin-top: 10px; }
      .hdate { font-weight: 600; font-size: 14px; color: var(--muted); }
      .hdate.today { color: var(--accent); }
      .hocc { border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; margin-top: 6px; }
      .hocc.closed { background: var(--ground); }
      .hocc.empty { padding: 5px 10px; }
      .hocc.empty .hacts { margin-top: 2px; }
      .hcourse { font-size: 11.5px; padding: 0 7px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
      .hhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; }
      .hhead .ht { white-space: nowrap; }
      .hhead .meta { flex-basis: 100%; font-size: 12px; }
      .ht { font-weight: 600; font-variant-numeric: tabular-nums; }
      .hcnt { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
      .hcnt.full { color: var(--warn); font-weight: 600; }
      .hseat { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 6px; padding: 3px 0; font-size: 14px; border-top: 1px dashed var(--rule); }
      .hseat .att { margin-left: auto; }   /* w22: ピルが3つで入らないときは名前の下の行に（名前は折らない） */
      .hseat.off .hn { color: var(--muted); text-decoration: line-through; }
      .htag { font-size: 11px; padding: 0 6px; border-radius: 999px; margin-left: 4px; background: var(--ground); color: var(--muted); white-space: nowrap; }
      .htag.mv, .htag.ad { background: var(--accent-soft); color: var(--accent); }
      .htag.tr { background: var(--warn-soft); color: var(--warn); }
      .htag.cash { background: var(--caution-soft); color: var(--caution); }
      .htag.ok { background: var(--ok-soft); color: var(--ok); }
      .htag.ng { background: var(--warn-soft); color: var(--warn); }
      .hb { font: inherit; font-size: 12.5px; padding: 3px 9px; border-radius: 8px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); white-space: nowrap; }
      .hb.p { background: var(--accent); color: #fff; }
      .hb.no { border-color: var(--warn); color: var(--warn); }
      .hacts { display: flex; gap: 6px; margin-top: 6px; }
      .hadd select, .hadd input { font: inherit; font-size: 13px; padding: 4px 6px; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); max-width: 100%; margin: 2px 4px 2px 0; }

      /* ---- w20 luce らしい見た目（色・書体・イラスト）。動きは変えない。絵は luce-page の img/ ---- */
      :root {
        --ground: #fbf8f5; --surface: #ffffff; --ink: #2b2a28; --muted: #7a7670; --rule: #ece7e1;
        --accent: #0e9ea6; --accent-soft: #e2f3f4; --warn: #bf2a82; --warn-soft: #f7e3ee;
        --caution: #b5652b; --caution-soft: #fbe9e0; --ok: #308639; --ok-soft: #e4f2e6;
        --pink: #ffd7dd; --pink-ink: #8a4a58; --pu: #833cd5; --pu-soft: #eee6f8; --co: #e08256; --ye: #e2cf3a;
        --shadow: 0 1px 2px rgba(60,40,30,.05), 0 10px 26px -18px rgba(60,40,30,.35);
      }
      body { font-family: "Zen Maru Gothic", -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--ground); }
      .wrap { padding: 0 12px 40px; }
      header.hdr { position: relative; display: flex; align-items: flex-end; gap: 12px; margin: 0 -12px; padding: 44px 16px 14px; min-height: 156px; overflow: hidden;
        background: var(--pink) url(https://nulu-luce.github.io/luce-page/img/header.webp) right -200px top 32% / 520px auto no-repeat; }
      header.hdr::after { content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(90deg, var(--pink) 0%, var(--pink) 40%, rgba(255,215,221,.45) 100%), linear-gradient(180deg, rgba(255,215,221,0) 50%, var(--pink) 100%); }
      header.hdr > * { position: relative; z-index: 1; }
      .hdr .logo { width: 68px; height: 68px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 2px 8px rgba(120,60,70,.18); }
      .hdr .logo img { width: 62px; height: 62px; display: block; }
      .hdr .hello { color: var(--pink-ink); padding-right: 92px; min-width: 0; }
      .hdr .hello .name { font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif; font-weight: 600; font-size: 20px; line-height: 1.3; }
      .hdr .hello .name .g { display: block; font-size: 15px; font-weight: 500; }
      .hdr .hello .name .n { white-space: nowrap; }
      .hdr .hello .who:empty { display: none; }
      .hdr .hello .date { font-size: 13px; opacity: .85; }
      .hdr .hello .who { font-size: 11px; opacity: .75; color: var(--pink-ink); }

    <script>
/*
 * luce 講師ページ（静的版）の橋渡し。tools/build-site.mjs が各ページの先頭に埋め込む。
 *
 * GAS の画面では google.script.run でサーバーの関数を呼ぶ。静的ページには google.script が無いので、
 * 同じ形のものをここで作り、中では GAS の JSON API（40_Api.js）を fetch で呼ぶ。
 * 別ドメインからの fetch には Google の Cookie が付かない（credentials: 'omit'）ので、
 * ブラウザがどのアカウントにログインしていても関係なく動く。
 *
 * https://script.google.com/macros/s/AKfycbxDM30NCEgTMLrWZ1Z3muR9gg2JWF3_mK1AVsKL-nW5gyFKnY0x2fmrvEK6FIBxtcfQ/exec はビルド時に 00_Config.js の WEBAPP_URL に置き換わる。
 * 画面のコード（status.html / events.html）は GAS 版と同じものをそのまま使う。
 */
(function (w) {
  var API_URL = 'https://script.google.com/macros/s/AKfycbxDM30NCEgTMLrWZ1Z3muR9gg2JWF3_mK1AVsKL-nW5gyFKnY0x2fmrvEK6FIBxtcfQ/exec';

  function parseQuery(search) {
    var out = {};
    String(search || '').replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      try { k = decodeURIComponent(k.replace(/\+/g, ' ')); } catch (err) { /* そのまま */ }
      try { v = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (err) { /* そのまま */ }
      if (k) out[k] = v;
    });
    return out;
  }

  function toQuery(params) {
    var p = params || {};
    return Object.keys(p).filter(function (k) { return p[k] !== undefined && p[k] !== null && p[k] !== ''; })
      .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(String(p[k])); })
      .join('&');
  }

  var q = parseQuery(w.location && w.location.search);
  // token は先生の合言葉（?t=）、s は生徒ページ（ホケホケ）の家庭の合言葉（?s=。w21）
  w.__luce = { token: q.t || '', no: q.no || '', s: q.s || '', apiUrl: API_URL, parseQuery: parseQuery, toQuery: toQuery };

  function finish(promise, ok, ng) {
    promise
      .then(function (res) { return res.json(); })
      .then(function (body) {
        if (body && body.ok) ok(body.data);
        else ng(new Error((body && body.error) || '応答が読めませんでした'));
      }, function (err) {
        var why = err && err.message ? err.message : String(err);
        ng(new Error('通信に失敗しました。電波の良いところでもう一度お試しください（' + why + '）'));
      });
  }

  function get(params, ok, ng) {
    finish(w.fetch(API_URL + '?' + toQuery(params), { method: 'GET', credentials: 'omit', cache: 'no-store' }), ok, ng);
  }

  function post(body, ok, ng) {
    // Content-Type を text/plain にすると preflight（OPTIONS）が飛ばない。GAS は OPTIONS に答えられない
    finish(w.fetch(API_URL, {
      method: 'POST', credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }), ok, ng);
  }

  /** google.script.run と同じ形。呼ぶたびに新しいものを返す（ハンドラが次の呼び出しに残らない） */
  function runner() {
    var ok = function () {};
    var ng = function (err) { if (w.console && w.console.error) w.console.error(err); };
    var r = {
      withSuccessHandler: function (f) { ok = f; return r; },
      withFailureHandler: function (f) { ng = f; return r; },
      withUserObject: function () { return r; },
      getStatusPage: function (p) { get({ api: 'status', t: p && p.t, no: p && p.no, fresh: p && p.fresh ? '1' : '' }, ok, ng); },
      getEventPage: function (p) { get({ api: 'events', t: p && p.t }, ok, ng); },
      saveEventAnswer: function (eventId, answer, comment, p) {
        post({ api: 'saveEventAnswer', t: p && p.t, eventId: eventId, answer: answer, comment: comment }, ok, ng);
      },
      saveStudentAnswers: function (eventId, rows, noStudents, p) {
        post({ api: 'saveStudentAnswers', t: p && p.t, eventId: eventId, rows: rows || [], noStudents: !!noStudents }, ok, ng);
      },
      // w7: ホーム
      getHomePage: function (p) { get({ api: 'home', t: p && p.t, no: p && p.no }, ok, ng); },
      markTaskDone: function (taskId, p) { post({ api: 'markTaskDone', t: p && p.t, no: p && p.no, taskId: taskId }, ok, ng); },
      askQuestion: function (text, p) { post({ api: 'askQuestion', t: p && p.t, no: p && p.no, text: text }, ok, ng); },
      // w10: 部屋の空き
      getRoomsPage: function (p) { get({ api: 'rooms', t: p && p.t, no: p && p.no, campus: p && p.campus }, ok, ng); },
      // w11: 振替・予約の申請
      submitRequest: function (input, p) { post({ api: 'submitRequest', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      cancelRequest: function (id, reason, p) { post({ api: 'cancelRequest', t: p && p.t, no: p && p.no, id: id, reason: reason || '' }, ok, ng); },
      decideRequest: function (id, decision, comment, force, p) { post({ api: 'decideRequest', t: p && p.t, no: p && p.no, id: id, decision: decision, comment: comment || '', force: !!force }, ok, ng); },
      // w12: レッスン記録
      saveRecord: function (input, p) { post({ api: 'saveRecord', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      // w14: 管理者が質問に返す
      answerQuestion: function (row, at, qno, text, p) { post({ api: 'answerQuestion', t: p && p.t, no: p && p.no, row: row, at: at, qno: qno, text: text }, ok, ng); },
      // w17: ホケホケ
      getHokePage: function (p) { get({ api: 'hoke', t: p && p.t, no: p && p.no, week: p && p.week }, ok, ng); },
      hokeCandidates: function (rightId, p) { get({ api: 'hokeCandidates', t: p && p.t, no: p && p.no, rightId: rightId, past: p && p.past ? '1' : '' }, ok, ng); },
      hokeSetState: function (input, p) { post({ api: 'hokeSetState', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      hokeMove: function (input, p) { post({ api: 'hokeMove', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      hokeAdd: function (input, p) { post({ api: 'hokeAdd', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      hokeCancel: function (input, p) { post({ api: 'hokeCancel', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      hokeClose: function (input, p) { post({ api: 'hokeClose', t: p && p.t, no: p && p.no, input: input || {} }, ok, ng); },
      // w21: ホケホケの生徒ページ（家庭の合言葉 s）
      getHokeParentPage: function (p) { get({ api: 'hokeParent', s: p && p.s }, ok, ng); },
      hokeParentCandidates: function (rightId, p) { get({ api: 'hokeParentCandidates', s: p && p.s, rightId: rightId }, ok, ng); },
      hokeParentAbsent: function (input, p) { post({ api: 'hokeParentAbsent', s: p && p.s, input: input || {} }, ok, ng); },
      hokeParentUndo: function (input, p) { post({ api: 'hokeParentUndo', s: p && p.s, input: input || {} }, ok, ng); },
      hokeParentMove: function (input, p) { post({ api: 'hokeParentMove', s: p && p.s, input: input || {} }, ok, ng); },
      hokeParentCancel: function (input, p) { post({ api: 'hokeParentCancel', s: p && p.s, input: input || {} }, ok, ng); }
    };
    return r;
  }

  function replaceUrl(mode, state, params, hash) {
    try {
      w.history[mode](state || null, '', '?' + toQuery(params) + (hash ? '#' + hash : ''));
    } catch (err) { /* 古いブラウザ */ }
  }

  var script = {
    url: {
      getLocation: function (cb) {
        cb({ parameter: parseQuery(w.location && w.location.search), parameters: {}, hash: '' });
      }
    },
    history: {
      replace: function (state, params, hash) { replaceUrl('replaceState', state, params, hash); },
      push: function (state, params, hash) { replaceUrl('pushState', state, params, hash); },
      setChangeHandler: function () {}
    }
  };
  Object.defineProperty(script, 'run', { get: runner });
  w.google = { script: script };

  /** ページの中のリンク（「イベント →」など）に合言葉を引き継ぐ */
  function keepToken() {
    if (!w.document || !w.document.querySelectorAll) return;
    var as = w.document.querySelectorAll('a[data-keep-token]');
    for (var i = 0; i < as.length; i++) {
      var href = as[i].getAttribute('href') || '';
      as[i].setAttribute('href', href.replace(/[?#].*$/, '') + '?' + toQuery({ t: w.__luce.token }));
    }
  }
  if (w.document && w.document.addEventListener) w.document.addEventListener('DOMContentLoaded', keepToken);
  w.__luce.keepToken = keepToken;
})(window);

    </script>
    <script>
      var STATE = {};
      var FILTER = 'all';
      var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      };
      var yen = function (n) { return (Number(n) || 0).toLocaleString('ja-JP') + '円'; };

      // 合言葉はサーバー側（doGet）が埋め込む。GAS は中身を iframe で出すので、
      // 画面の JavaScript から元の URL（?t=…）は見えない
      var TOKEN = window.__luce.token;
      var WANT_NO = window.__luce.no;

      var IMG_BASE = 'https://nulu-luce.github.io/luce-page/img/';
      var COMPOSERS = [['bach', 'バッハ'], ['mozart', 'モーツァルト'], ['beethoven', 'ベートーヴェン'], ['chopin', 'ショパン'], ['liszt', 'リスト']];
      function greet(data) {
        var h = new Date().getHours();
        var g = h < 5 ? 'こんばんは' : (h < 11 ? 'おはようございます' : (h < 18 ? 'こんにちは' : 'こんばんは'));
        var name = data && data.teacherName ? String(data.teacherName).trim() + ' 先生' : '';
        var el = document.getElementById('hello'); if (el) el.innerHTML = name ? '<span class="g">' + esc(g) + '、</span><span class="n">' + esc(name) + '</span>' : esc(g);
        var d = document.getElementById('hdate');
        if (d && data && data.todayLabel) d.textContent = String(data.todayLabel).replace(/^(\d+)\/(\d+)\((.)\)$/, '$1月$2日（$3）');
        var c = COMPOSERS[Math.floor(Date.now() / 86400000) % COMPOSERS.length];
        var im = document.getElementById('comp'); if (im && !im.getAttribute('src')) im.src = IMG_BASE + 'comp_' + c[0] + '.webp';
        var cn = document.getElementById('compname'); if (cn) cn.textContent = '今日の作曲家: ' + c[1];
      }
      function footHtml(version) {
        return '<div class="poem">luceがダメなら他はない</div><div class="v">ピアノ教室 luce 講師ページ' + (version ? '　' + esc(version) : '') + '</div>';
      }

      function start() {
        greet(null);
        try {
          google.script.url.getLocation(function (loc) {
            var no = (loc && loc.parameter && loc.parameter.no) || WANT_NO || '';
            load(no);
          });
        } catch (err) { load(WANT_NO || ''); }
      }
      window.onerror = function (msg) {
        var main = document.getElementById('main');
        if (main && /読み込み中|まだ読んでいます/.test(main.textContent)) renderCenter('画面でエラーが起きました。\n' + msg);
      };

      var TIMERS = [];
      function clearTimers() { TIMERS.forEach(function (t) { clearTimeout(t); }); TIMERS = []; }

      function load(no, fresh) {
        clearTimers();
        STATE.teacherNo = no || STATE.teacherNo || '';
        loadHome(STATE.teacherNo);
        renderCenter('読み込み中…\n（シートを読むので少し時間がかかります）');
        try {
          if (!window.google || !google.script || !google.script.run) {
            throw new Error('google.script.run が使えません。GASのウェブアプリとして開いてください');
          }
          if (typeof google.script.run.getStatusPage !== 'function') {
            throw new Error('サーバー側に getStatusPage がありません。30_Status.gs が貼られていないか、'
              + '貼った後に「デプロイを管理 → 新バージョン → デプロイ」をしていない可能性があります');
          }
          TIMERS.push(setTimeout(function () {
            renderCenter('まだ読んでいます…\n初めて開くときや、講師ファイルが多いときは1分ほどかかることがあります');
          }, 25000));
          TIMERS.push(setTimeout(function () {
            document.getElementById('main').innerHTML = '<div class="center">2分たっても返ってきません。\n'
              + '通信が切れたか、読み込みに失敗した可能性があります。</div>'
              + '<button class="reload" onclick="load(STATE.teacherNo, true)">もう一度読み込む</button>'
              + '<p class="hint">何度も続くときは、日置までお知らせください（GASの「実行数」で getStatusPage の結果を見ると原因が分かります）。</p>';
          }, 120000));
          google.script.run
            .withSuccessHandler(function (data) { clearTimers(); render(data); })
            .withFailureHandler(function (err) { clearTimers(); renderCenter('読み込めませんでした。\n' + err.message); })
            .getStatusPage({ no: no || '', t: TOKEN, fresh: !!fresh });
        } catch (err) {
          clearTimers();
          renderCenter('読み込めませんでした。\n' + err.message);
        }
      }

      /* ---- w7 ホーム: 今日のレッスン・お知らせ・提出物・よくある質問（講師運営ブックだけを読むので速い） ---- */
      var HOME = {};
      function loadHome(no) {
        var box = document.getElementById('home');
        if (!box) return;
        if (window.HOKE) { HOKE.data = null; HOKE.error = ''; HOKE.pick = null; HOKE.add = null; }   // w17: 先生を切り替えたら読み直す
        if (!box.innerHTML) box.innerHTML = '<div class="card today"><div class="meta">今日の予定を読み込み中…</div></div>';
        try {
          if (!window.google || !google.script || !google.script.run || typeof google.script.run.getHomePage !== 'function') {
            box.innerHTML = '';
            return;
          }
          google.script.run
            .withSuccessHandler(function (data) { HOME = data || {}; renderHome(HOME); })
            .withFailureHandler(function (err) {
              box.innerHTML = '<div class="card"><div class="banner err">今日の予定を読み込めませんでした。' + esc(err.message) + '</div></div>';
            })
            .getHomePage({ no: no || '', t: TOKEN });
        } catch (err) { box.innerHTML = ''; }
      }

      function renderHome(data) {
        var box = document.getElementById('home');
        greet(data);
        if (!document.getElementById('foot').innerHTML) document.getElementById('foot').innerHTML = footHtml(data.version);
        if (data.error) {
          box.innerHTML = '<div class="card"><div class="banner err">' + esc(data.error) + '</div></div>';
          return;
        }
        if (!document.getElementById('admin').innerHTML) renderAdmin(data);   // 今月の状況より先に、講師シートから出す
        if (data.hoke) {   // w17: 成瀬先生のホケホケ。今日のレッスン・部屋の空き・申請の代わりに
          if (!HOKE.data && !HOKE.loading && data.hokeData && !data.hokeData.error) { HOKE.data = data.hokeData; HOKE.week = 0; }   // w19: ホームと一緒に来た今週のぶん
          box.innerHTML = pendingQuestionsHtml(data) + pendingHtml(data) + hokeCardHtml() + noticesHtml(data) + tasksHtml(data) + faqHtml(data);
          if (!HOKE.data && !HOKE.loading) loadHoke(HOKE.week);
          return;
        }
        box.innerHTML = pendingQuestionsHtml(data) + pendingHtml(data) + todayHtml(data) + roomsCardHtml() + requestsHtml(data) + noticesHtml(data) + tasksHtml(data) + faqHtml(data);
      }

      function kindBadge(k) {
        if (k === '体験') return '<span class="badge trial">体験</span>';
        if (k === '新規') return '<span class="badge new">新規</span>';
        if (k === '振替') return '<span class="badge move">振替</span>';
        if (k === '予約') return '<span class="badge book">予約</span>';
        return '';
      }

      function todayHtml(data) {
        var days = data.schedule || [];
        var today = days.filter(function (d) { return d.ymd === data.today; })[0] || { rooms: [], students: [], flags: [] };
        var html = '<div class="card today"><h2>今日<small>' + esc(data.todayLabel || '') + '</small></h2>';
        var past = data.past || [];
        var yday = past.filter(function (d) { return d.ymd === addDays(data.today, -1); })[0];
        if (yday) {
          var un = yday.students.filter(function (s) { var r = (data.records || {})[recKey(yday.ymd, s)]; return !(r && r.attend); }).length;
          if (un) html += '<div class="unrec">昨日 押していない生徒が ' + un + ' 人います（下の「昨日まで」から付けられます）</div>';
        }
        if (!data.hasSchedule) {
          html += '<div class="meta">予定はまだ書き出されていません（日置が luce給与の「予定シートを書き出す」を実行すると出ます）</div>';
        } else if (!today.rooms.length && !today.students.length) {
          html += '<div class="meta empty-today">今日のレッスンはありません</div>';
        } else {
          html += today.rooms.map(function (r) {
            return '<div class="room"><b>' + esc(r.room) + '</b>' + (r.campus ? '<span class="meta">' + esc(r.campus) + '</span>' : '')
              + '<span class="time">' + esc(r.lesson) + '</span><span class="meta">（部屋は ' + esc(r.block) + '）</span>'
              + (r.note ? '<span class="badge">' + esc(r.note) + '</span>' : '') + '</div>';
          }).join('');
          if (today.students.length) {
            html += '<div class="stu">' + today.students.map(function (s) { return studentRowHtml(data, today, s, true); }).join('') + '</div>';
          }
        }
        if (past.length) {
          html += '<details><summary>昨日まで（' + past.length + '日）</summary>' + past.map(function (d) {
            return '<div class="pastday"><div class="pd">' + esc(d.label) + '</div><div class="stu">'
              + d.students.map(function (s) { return studentRowHtml(data, d, s, true); }).join('') + '</div></div>';
          }).join('') + '</details>';
        }
        var rest = days.filter(function (d) { return d.ymd !== data.today && (d.rooms.length || d.students.length); });
        if (rest.length) {
          html += '<details><summary>明日から1週間（' + rest.length + '日）</summary><div class="week">' + rest.map(function (d) {
            var rooms = d.rooms.map(function (r) { return r.room + ' ' + r.lesson; }).join('、');
            var flags = (d.flags || []).map(function (f) { return '<span class="badge' + (f === '体験' ? ' trial' : '') + '">' + esc(f) + '</span>'; }).join('');
            return '<div class="d"><div>' + esc(d.label) + '</div><div>' + esc(rooms || '—') + ' <span class="rest">' + d.students.length + '名</span>' + flags + '</div></div>';
          }).join('') + '</div></details>';
        }
        html += '<p class="hint">出欠は押した瞬間に記録されます。当日欠席は報酬あり、事前キャンセルと休講は振替日に報酬です。月報の出欠は今までどおり付けてください。</p></div>';
        return html;
      }

      /* ---- w12 レッスン記録 ---- */
      function addDays(ymd, n) {
        var m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return '';
        var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]) + n);
        return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
      }
      function recKey(ymd, s) {
        var hm = String(s.time || '');
        var m = hm.match(/^(\d{1,2}):(\d{2})/);
        return ymd + '|' + (s.id || String(s.name || '').normalize('NFKC').replace(/[\s　]/g, '')) + '|' + (m ? ('0' + m[1]).slice(-2) + ':' + m[2] : '');
      }
      function studentRowHtml(data, day, s, withRec) {
        var multi = (day.rooms || []).length > 1 || s.kind === '振替' || s.kind === '予約';
        var html = '<div class="t">' + esc(s.time) + '</div><div>' + esc(s.name) + kindBadge(s.kind)
          + (s.note ? '<span class="lv"> ' + esc(s.note) + '</span>' : '') + '</div>'
          + '<div class="lv">' + esc(s.level) + (s.min ? ' ' + esc(s.min) + '分' : '') + (multi ? '<br>' + esc(s.room) : '') + '</div>';
        if (!withRec) return html;
        var key = recKey(day.ymd, s);
        var r = (data.records || {})[key] || {};
        var opts = data.attendOptions || ['出席', '当日欠席', '事前キャンセル', '休講'];
        var pills = opts.map(function (a) {
          var pay0 = a === '事前キャンセル' || a === '休講';
          return '<button type="button" class="' + (r.attend === a ? 'on' + (pay0 ? ' pay0' : '') : '') + '" onclick="saveAttend(this, \'' + esc(day.ymd) + '\', \'' + esc(s.id || '') + '\', \'' + esc(s.name) + '\', \'' + esc(s.time) + '\', \'' + esc(s.room) + '\', \'' + esc(s.kind) + '\', \'' + esc(a) + '\')">' + esc(a) + '</button>';
        }).join('');
        var tnote = '';
        if (r.attend === '事前キャンセル' || r.attend === '休講') tnote = '<div class="tnote' + (r.transfer === '未申請' ? ' none' : '') + '">振替: ' + esc(r.transfer || '未申請') + (r.transfer === '未申請' ? '（下の「振替・予約の申請」から）' : '') + '</div>';
        return html + '<div class="rec"><div class="att">' + pills + '</div>' + tnote
          + '<div class="memo"><input placeholder="メモ（先生の控え）" value="' + esc(r.memo || '') + '" onchange="saveMemo(this, \'' + esc(day.ymd) + '\', \'' + esc(s.id || '') + '\', \'' + esc(s.name) + '\', \'' + esc(s.time) + '\', \'' + esc(s.room) + '\', \'' + esc(s.kind) + '\')"><span class="ok"></span></div></div>';
      }
      function saveAttend(btn, ymd, id, name, time, room, kind, attend) {
        var key = recKey(ymd, { id: id, name: name, time: time });
        var cur = (HOME.records || {})[key] || {};
        var next = cur.attend === attend ? '' : attend;   // もう一度押すと消す
        var row = btn.parentNode.parentNode;
        Array.prototype.forEach.call(row.querySelectorAll('.att button'), function (b) { b.disabled = true; });
        postRecord({ ymd: ymd, studentId: id, studentName: name, hm: time, room: room, kind: kind, attend: next, memo: cur.memo || '' }, row);
      }
      function saveMemo(input, ymd, id, name, time, room, kind) {
        var key = recKey(ymd, { id: id, name: name, time: time });
        var cur = (HOME.records || {})[key] || {};
        postRecord({ ymd: ymd, studentId: id, studentName: name, hm: time, room: room, kind: kind, attend: cur.attend || '', memo: input.value.trim() }, input.parentNode.parentNode);
      }
      function postRecord(input, row) {
        google.script.run
          .withSuccessHandler(function (res) {
            HOME.records = (res && res.records) || HOME.records;
            renderHome(HOME);
          })
          .withFailureHandler(function (err) {
            Array.prototype.forEach.call(row.querySelectorAll('.att button'), function (b) { b.disabled = false; });
            alert('記録できませんでした。' + err.message);
          })
          .saveRecord(input, { t: TOKEN, no: STATE.teacherNo || '' });
      }

      /* 文の中の URL をリンクに（お知らせの配布物など。w19）。esc したあとに置き換える */
      function linkify(text) {
        return esc(text).replace(/(https?:\/\/[^\s<]+)/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; });
      }
      function noticesHtml(data) {
        var ns = data.notices || [];
        var html = '<div class="card notices"><h2>お知らせ' + (ns.length ? '<small>' + ns.length + '件</small>' : '') + '</h2>';
        if (!ns.length) return html + '<div class="meta">いまのお知らせはありません</div></div>';
        return html + ns.map(function (n) {
          return '<div class="notice"><div class="dt">' + esc(n.label) + '</div><div class="tt">' + esc(n.title) + '</div>'
            + (n.body ? '<div class="bd">' + linkify(n.body) + '</div>' : '') + '</div>';
        }).join('') + '</div>';
      }

      function tasksHtml(data) {
        var ts = data.tasks || [];
        var open = ts.filter(function (t) { return !t.done; }).length;
        var html = '<div class="card tasks"><h2>提出物' + (ts.length ? '<small>未提出 ' + open + '件</small>' : '') + '</h2><div id="tasks">';
        if (!ts.length) return html + '<div class="meta">いま出してもらうものはありません</div></div></div>';
        return html + ts.map(taskHtml).join('') + '</div><p class="hint">出し終えたら「提出しました」を押してください。日置の側で確認します。</p></div>';
      }

      function taskHtml(t) {
        var link = t.link ? ' <a href="' + esc(t.link) + '" target="_blank" rel="noopener">開く</a>' : '';
        var right = t.done
          ? '<span class="did">✓ 提出済み<br>' + esc(t.doneAt) + '</span>'
          : '<button onclick="markDone(\'' + esc(t.id) + '\', this)">提出しました</button>';
        return '<div class="task"><div class="body"><div>' + esc(t.item) + '</div>'
          + (t.due ? '<div class="due' + (t.overdue ? ' over' : '') + '">期限 ' + esc(t.dueLabel) + (t.overdue ? '（過ぎています）' : '') + '</div>' : '')
          + ((t.desc || link) ? '<div class="desc">' + esc(t.desc) + link + '</div>' : '') + '</div>' + right + '</div>';
      }

      function markDone(id, btn) {
        if (btn) { btn.disabled = true; btn.textContent = '送信中…'; }
        google.script.run
          .withSuccessHandler(function (res) {
            HOME.tasks = (res && res.tasks) || HOME.tasks;
            var box = document.getElementById('tasks');
            if (box) box.innerHTML = (HOME.tasks || []).map(taskHtml).join('');
          })
          .withFailureHandler(function (err) {
            if (btn) { btn.disabled = false; btn.textContent = '提出しました'; }
            alert('記録できませんでした。' + err.message);
          })
          .markTaskDone(id, { t: TOKEN, no: STATE.teacherNo || '' });
      }

      function faqHtml(data) {
        var fs = data.faq || [];
        var html = '<div class="card faq"><h2>よくある質問</h2>';
        html += fs.length
          ? fs.map(function (f) { return '<details><summary>' + esc(f.q) + '</summary><div class="a">' + esc(f.a) + '</div></details>'; }).join('')
          : '<div class="meta">まだありません</div>';
        var qs = data.questions || [];
        if (qs.length) {
          html += '<details' + (qs.some(function (q) { return !q.answer; }) ? '' : '') + '><summary>自分の質問（' + qs.length + '件' + (qs.filter(function (q) { return !q.answer; }).length ? '・回答待ち ' + qs.filter(function (q) { return !q.answer; }).length : '') + '）</summary>'
            + qs.map(function (q) {
              return '<div class="notice"><div class="dt">' + esc(q.at) + '</div><div class="bd">' + esc(q.text) + '</div>'
                + (q.answer ? '<div class="a">' + esc(q.answer) + (q.answeredAt ? '<div class="dt">' + esc(q.answeredAt) + '</div>' : '') + '</div>' : '<div class="dt">回答待ち</div>') + '</div>';
            }).join('') + '</details>';
        }
        html += '<details><summary>質問を送る</summary>'
          + '<textarea id="q" placeholder="ここに書いて「送る」を押すと日置に届きます。回答はここと、メールに届きます"></textarea>'
          + '<button class="send" id="qbtn" onclick="sendQuestion()">送る</button><div class="sent" id="qsent"></div></details></div>';
        return html;
      }

      function sendQuestion() {
        var ta = document.getElementById('q');
        var btn = document.getElementById('qbtn');
        var text = ta ? ta.value.trim() : '';
        if (!text) { alert('質問を書いてください'); return; }
        btn.disabled = true;
        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false; ta.value = '';
            document.getElementById('qsent').textContent = '送りました。' + (res && res.sent === 'chat' ? 'Chat に届いています。' : '日置に届いています。');
          })
          .withFailureHandler(function (err) { btn.disabled = false; alert('送れませんでした。' + err.message); })
          .askQuestion(text, { t: TOKEN, no: STATE.teacherNo || '' });
      }

      /* ---- w17 ホケホケ（成瀬先生と管理者だけ。ホームの hoke が true のとき、今日のレッスン・部屋の空き・申請の代わりに出す） ---- */
      var HOKE = { week: 0, data: null, loading: false, error: '', pick: null, add: null, busy: false };
      function hokeCardHtml() {
        return '<div class="card today" id="hokeCard"><h2>ホケホケ<small id="hokeWeek">' + (HOKE.data ? esc(HOKE.data.week.label) : '') + '</small></h2><div id="hoke">' + hokeInnerHtml() + '</div></div>';
      }
      function rerenderHoke() {
        var el = document.getElementById('hoke'); if (el) el.innerHTML = hokeInnerHtml();
        var w = document.getElementById('hokeWeek'); if (w) w.textContent = HOKE.data ? HOKE.data.week.label : '';
      }
      function hokeP() { return { t: TOKEN, no: STATE.teacherNo || '' }; }
      function loadHoke(week) {
        HOKE.week = Number(week) || 0; HOKE.loading = true; HOKE.error = ''; HOKE.pick = null; HOKE.add = null;
        rerenderHoke();
        try {
          if (!window.google || !google.script || !google.script.run || typeof google.script.run.getHokePage !== 'function') {
            throw new Error('サーバー側に getHokePage がありません（貼り替えのあと「新バージョン」でデプロイしてください）');
          }
          google.script.run
            .withSuccessHandler(function (data) { HOKE.loading = false; if (!data || data.error) { HOKE.error = (data && data.error) || '読めませんでした'; } else { HOKE.data = data; } rerenderHoke(); })
            .withFailureHandler(function (err) { HOKE.loading = false; HOKE.error = err.message; rerenderHoke(); })
            .getHokePage({ t: TOKEN, no: STATE.teacherNo || '', week: HOKE.week });
        } catch (err) { HOKE.loading = false; HOKE.error = err.message; rerenderHoke(); }
      }
      function hokeSend(name, input) {
        if (HOKE.busy) return;
        HOKE.busy = true; HOKE.loading = true; input.week = HOKE.week; rerenderHoke();
        google.script.run
          .withSuccessHandler(function (res) { HOKE.busy = false; HOKE.loading = false; if (res && !res.error) HOKE.data = res; rerenderHoke(); })
          .withFailureHandler(function (err) { HOKE.busy = false; HOKE.loading = false; alert('できませんでした。' + err.message); rerenderHoke(); })
          [name](input, hokeP());
      }
      function courseClass(c) {
        var m = { 'にんじん': 'ninjin', 'おいも': 'oimo', 'かぼちゃ': 'kabocha', 'ねぎ': 'negi', 'せろり': 'serori', 'セロリ': 'serori' };
        return m[String(c || '').trim()] ? 'c-' + m[String(c || '').trim()] : '';
      }
      function hokeClassLabel(d, id) { var c = (d.classes || []).filter(function (x) { return x.id === id; })[0]; return c ? c.weekday + ' ' + c.hm : id; }
      function hokeInnerHtml() {
        if (HOKE.loading) return '<div class="meta">読み込み中…</div>';
        if (HOKE.error) return '<div class="banner err">' + esc(HOKE.error) + '</div><button class="rbtn" onclick="loadHoke(HOKE.week)">もう一度</button>';
        var d = HOKE.data; if (!d) return '';
        var html = '<div class="hnav"><button onclick="loadHoke(HOKE.week - 1)">‹ 前の週</button><button' + (HOKE.week === 0 ? ' class="on"' : '') + ' onclick="loadHoke(0)">今週</button><button onclick="loadHoke(HOKE.week + 1)">次の週 ›</button></div>';
        if (d.noClass && d.noClass.length) html += '<div class="banner info">名簿に曜日か時刻が無い生徒: ' + esc(d.noClass.join('、')) + '（名簿を直すと次の時間に反映）</div>';
        if (d.rights && d.rights.length) {
          html += '<div class="hrights"><b>振替の権利</b>（' + d.rights.length + '）' + d.rights.map(function (r) {
            return '<div class="hr"><span>' + esc(r.name) + '<span class="meta">　' + esc(r.label) + ' の欠席</span></span><button class="hb" onclick="hokePick(\'' + esc(r.attId) + '\')">振替先を選ぶ</button></div>';
          }).join('') + '</div>';
        }
        if (HOKE.pick) html += hokePickHtml();
        if (!d.week.days.length) html += '<div class="meta">この週のクラスはありません</div>';
        d.week.days.forEach(function (day) {
          html += '<div class="hday"><div class="hdate' + (day.ymd === d.today ? ' today' : '') + '">' + esc(day.label) + (day.ymd === d.today ? '（今日）' : '') + '</div>' + day.occs.map(function (o) { return hokeOccHtml(d, o); }).join('') + '</div>';
        });
        html += '<p class="hint">人数 ＝ 基本 − 欠席連絡 ＋ 振替 ＋ 追加 ＋ 体験。定員 ' + d.cap + '。欠席の連絡は前日まで（振替の権利1回）。当日は「当日欠席」（振替なし）。'
          + '保護者が生徒ページから当日のお休みを送ると、この画面に「当日欠席」で入り、成瀬先生にメールが届きます。'
          + '過ぎた回の「事前キャンセル」は、前日までに直接連絡があったのに入れ忘れていたぶんを後から入れるとき（権利1回。振替先は「過ぎた回も出す」で選べます）。</p>';
        return html;
      }
      function hokeOccHtml(d, o) {
        var past = o.ymd < d.today, closed = o.status === '休講';
        var q = "'" + o.ymd + "','" + esc(o.classId) + "'";
        var empty = !closed && !o.seats.length;
        var h = '<div class="hocc' + (closed ? ' closed' : '') + (empty ? ' empty' : '') + '"><div class="hhead"><span class="ht">' + esc(o.hm) + '〜' + esc(o.endHm) + '</span>'
          + (o.course ? '<span class="hcourse ' + courseClass(o.course) + '">' + esc(o.course) + '</span>' : '')
          + (closed ? '<span class="badge trial">休講</span>' + (o.note ? '<span class="meta">' + esc(o.note) + '</span>' : '') : '<span class="hcnt' + (o.free === 0 ? ' full' : '') + '">' + o.count + ' / ' + o.cap + '</span>') + '</div>';
        if (!closed && o.seats.length) h += o.seats.map(function (s) { return hokeSeatHtml(d, o, s); }).join('');
        if (HOKE.add && HOKE.add.ymd === o.ymd && HOKE.add.classId === o.classId) h += hokeAddHtml(d, o);
        var acts = [];
        if (!closed && !past) acts.push('<button class="hb" onclick="hokeAddOpen(' + q + ')">追加</button>');
        if (!past) acts.push(closed ? '<button class="hb" onclick="hokeClose(' + q + ', false)">開講に戻す</button>' : '<button class="hb no" onclick="hokeClose(' + q + ', true)">休講にする</button>');
        if (acts.length) h += '<div class="hacts">' + acts.join('') + '</div>';
        return h + '</div>';
      }
      function hokeSeatHtml(d, o, s) {
        var future = o.ymd > d.today, st = s.state;
        var tags = '';
        if (s.kind !== '基本') tags += '<span class="htag ' + (s.kind === '振替' ? 'mv' : (s.kind === '体験' ? 'tr' : 'ad')) + '">' + esc(s.kind) + '</span>';
        if (/現金/.test(s.pay || '')) tags += '<span class="htag cash">現金</span>';
        var stLabel = (!future && st === '欠席連絡') ? '事前キャンセル' : st;   // w22: 過ぎた回の欠席連絡は「事前キャンセル」と出す（ピルと同じ言葉）
        if (st !== '予定') tags += '<span class="htag ' + (st === '出席' ? 'ok' : (st === '当日欠席' ? 'ng' : '')) + '">' + esc(stLabel) + '</span>';
        var q = "'" + o.ymd + "','" + esc(o.classId) + "','" + esc(s.studentId) + "','" + esc(s.attId) + "'";
        var btns = '';
        if (future) {
          if (s.kind === '基本') {
            if (st === '予定') btns = '<button class="hb" onclick="hokeState(' + q + ', \'欠席連絡\')">欠席</button>';
            else if (st === '欠席連絡' || st === '休講') btns = '<button class="hb" onclick="hokeState(' + q + ', \'予定\')">取り消す</button>';
          } else if (st === '予定' && s.attId) {   // 名簿の体験の子（行が無い）は稼働表の体験日で動くので、ここでは取りやめない
            btns = '<button class="hb" onclick="hokeCancel(\'' + esc(s.attId) + '\')">取りやめ</button>';
          }
        } else if (st !== '振替済み' && st !== '休講') {
          // w22: 今日と過ぎた回。基本の席には「事前キャンセル」も（前日までに直接連絡があったぶんを後から入れる。振替の権利1回）

      }
      function hokePickHtml() {
        var p = HOKE.pick;
        var h = '<div class="hpick"><b>' + esc(p.right.name) + ' さんの振替先</b><span class="meta">　' + esc(p.right.label) + ' の欠席のぶん' + (p.right.course ? '（' + esc(p.right.course) + ' のコースだけ）' : '') + '</span>';
        // w22: 過ぎた回も出す（保護者から直接聞いて振替先も決めていたのに入れ忘れていたぶんを後から入れる。済んだ回は「出席」で入る）
        h += '<label class="meta" style="display:block;margin:4px 0"><input type="checkbox"' + (p.past ? ' checked' : '') + ' onchange="hokePick(\'' + esc(p.right.attId) + '\', this.checked)"> 過ぎた回も出す（後から入力）</label>';

        else h += p.candidates.map(function (c) {
          return '<div class="hcand"><span>' + esc(c.label) + (c.past ? ' <span class="htag">済</span>' : '') + (c.course ? ' <span class="hcourse ' + courseClass(c.course) + '">' + esc(c.course) + '</span>' : '') + '</span><span class="meta">' + (c.past ? '済んだ回' : '残り ' + c.free + '席') + '</span><button class="hb p" onclick="hokeMove(\'' + esc(p.right.attId) + '\', \'' + c.ymd + '\', \'' + esc(c.classId) + '\', \'' + esc(c.label) + '\', ' + (c.past ? 'true' : 'false') + ')">' + (c.past ? 'この回にした' : 'この回にする') + '</button></div>';
        }).join('');
        return h + '<div style="margin-top:6px"><button class="hb" onclick="HOKE.pick = null; rerenderHoke()">閉じる</button></div></div>';
      }
      function hokeAddHtml(d, o) {
        var seated = {};
        o.seats.forEach(function (s) { if (s.state !== '欠席連絡' && s.state !== '振替済み' && s.state !== '休講') seated[s.studentId] = true; });
        var opts = (d.students || []).filter(function (s) { return !seated[s.id]; }).map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + (s.classId ? '（' + esc(hokeClassLabel(d, s.classId)) + '）' : '') + '</option>'; }).join('')
          + (d.trials || []).filter(function (s) { return !seated[s.id]; }).map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '（体験' + (s.trialYmd ? ' ' + esc(s.trialYmd) : '') + '）</option>'; }).join('');
        return '<div class="hadd"><div class="meta">この回に1回だけ入れる（振替ではなく追加。体験の子もここから）</div><select id="hokeAddSel"><option value="">生徒を選ぶ</option>' + opts + '</select> または <input id="hokeAddName" placeholder="一覧にない子の名前"><div style="margin-top:4px"><button class="hb p" onclick="hokeAddSend(\'' + o.ymd + '\', \'' + esc(o.classId) + '\')">入れる</button> <button class="hb" onclick="HOKE.add = null; rerenderHoke()">やめる</button></div></div>';
      }
      function hokeState(ymd, classId, studentId, attId, state) {
        if (state === '欠席連絡') {
          var late = HOKE.data && ymd <= HOKE.data.today;
          if (!confirm(late ? '前日までに連絡があった欠席（事前キャンセル）として記録しますか？\n振替の権利が1回付きます。当日になってからの連絡なら「当日欠席」です' : '欠席にしますか？（前日までの連絡なので、振替の権利が1回付きます）')) return;
        }
        hokeSend('hokeSetState', { ymd: ymd, classId: classId, studentId: studentId, attId: attId, state: state });
      }
      function hokeCancel(attId) { if (!confirm('この席を取りやめますか？')) return; hokeSend('hokeCancel', { attId: attId }); }
      function hokeClose(ymd, classId, closed) {
        if (!confirm(closed ? 'この回を休講にしますか？（基本の生徒全員に振替の権利が1回付き、振替・追加の席は取りやめになります）' : '開講に戻しますか？（まだ使っていない権利は消えます）')) return;
        hokeSend('hokeClose', { ymd: ymd, classId: classId, closed: !!closed });
      }
      function hokeMove(rightId, ymd, classId, label, past) {
        if (!confirm(past ? label + ' に振替えたことにしますか？（済んだ回なので「出席」で記録します）' : label + ' に振替えますか？')) return;
        HOKE.pick = null; hokeSend('hokeMove', { rightId: rightId, ymd: ymd, classId: classId });
      }
      function hokeAddOpen(ymd, classId) { HOKE.add = { ymd: ymd, classId: classId }; HOKE.pick = null; rerenderHoke(); }
      function hokeAddSend(ymd, classId) {
        var sel = document.getElementById('hokeAddSel'), nm = document.getElementById('hokeAddName');

      function hokePick(attId, past) {
        var r = ((HOKE.data || {}).rights || []).filter(function (x) { return x.attId === attId; })[0] || { attId: attId, name: '', label: '' };
        HOKE.pick = { right: r, candidates: [], loading: true, past: !!past }; HOKE.add = null; rerenderHoke();
        var p = hokeP(); p.past = !!past;   // w22: 過ぎた回も出す
        google.script.run

          .withFailureHandler(function (err) { HOKE.pick = null; alert(err.message); rerenderHoke(); })
          .hokeCandidates(attId, p);
      }

      /* ---- w10 部屋の空き: 押したときだけカレンダーを読む（ホームの読み込みを遅くしない） ---- */
      var ROOMS = { campus: '', data: null, loading: false, error: '' };
      try { ROOMS.campus = localStorage.getItem('luce-rooms-campus') || ''; } catch (err) {}

      function roomsCardHtml() {
        return '<div class="card" id="roomsCard"><h2>部屋の空き<small>今日から2週間</small></h2><div id="rooms">' + roomsInnerHtml() + '</div></div>';
      }

      function roomsInnerHtml() {
        if (ROOMS.loading) return '<div class="meta">読み込み中…（カレンダーを読むので数秒かかります）</div>';
        if (ROOMS.data) return roomsBodyHtml(ROOMS.data);

      }

      function rerenderRooms() {

        if (el) el.innerHTML = roomsInnerHtml();
      }

      function loadRooms(campus) {
        ROOMS.loading = true; ROOMS.error = ''; ROOMS.campus = campus || '';
        rerenderRooms();
        try {
          if (!window.google || !google.script || !google.script.run || typeof google.script.run.getRoomsPage !== 'function') {
            throw new Error('サーバー側に getRoomsPage がありません（貼り替えのあと「新バージョン」でデプロイしてください）');
          }
          google.script.run
            .withSuccessHandler(function (data) {
              ROOMS.loading = false;
              if (!data || data.error) { ROOMS.error = (data && data.error) || '読めませんでした'; ROOMS.data = null; }
              else { ROOMS.data = data; ROOMS.campus = data.campus; try { localStorage.setItem('luce-rooms-campus', data.campus); } catch (err) {} }
              rerenderRooms();

            .withFailureHandler(function (err) { ROOMS.loading = false; ROOMS.error = err.message; rerenderRooms(); })
            .getRoomsPage({ t: TOKEN, no: STATE.teacherNo || '', campus: ROOMS.campus });
        } catch (err) {
          ROOMS.loading = false; ROOMS.error = err.message; rerenderRooms();

      }

      function roomsBodyHtml(data) {
        var frame = data.frame || { START: 480, END: 1320 };
        var span = frame.END - frame.START;
        var pct = function (min) { return Math.max(0, Math.min(100, (min - frame.START) / span * 100)); };
        var html = '<div class="rchips">' + (data.campuses || []).map(function (c) {
          return '<button class="' + (c === data.campus ? 'on' : '') + '" onclick="loadRooms(\'' + esc(c) + '\')">' + esc(c) + '</button>';
        }).join('') + '</div>';
        var ticks = '';
        for (var h = Math.ceil(frame.START / 60); h * 60 <= frame.END; h += 3) ticks += '<span style="left:' + pct(h * 60) + '%">' + h + '時</span>';
        var days = data.days || [];
        var dayHtml = function (d) {
          var rooms = (d.rooms || []).map(function (r) {
            var segs = (r.busy || []).map(function (b) {
              var w = pct(b.e) - pct(b.s);
              var text = b.kind === 'lesson' ? b.label : (b.kind === 'rental' ? 'レンタル' : b.label);
              return '<span class="seg ' + esc(b.kind) + '" style="left:' + pct(b.s) + '%;width:' + w + '%" title="' + esc(text + ' ' + b.text) + '">' + (w >= 9 ? esc(text) : '') + '</span>';
            }).join('');
            var free = r.error
              ? '<div class="rfree err">' + esc(r.error) + '</div>'
              : ((r.free || []).length
                ? '<div class="rfree"><b>空き</b> ' + r.free.map(function (f) { return esc(f.text); }).join(' ／ ') + '</div>'
                : '<div class="rfree none">空きなし</div>');
            var list = (r.busy || []).map(function (b) { return esc(b.text) + ' ' + esc(b.kind === 'lesson' ? 'レッスン ' + b.label : (b.kind === 'rental' ? 'レンタル' : b.label)); }).join('<br>');
            return '<div class="rroom"><div class="rname" onclick="toggleRoomList(this)" title="予定の一覧を出す">' + esc(r.room) + '</div>'
              + '<div class="rbar">' + segs + '</div>' + free
              + (list ? '<div class="rlist" hidden>' + list + '</div>' : '') + '</div>';
          }).join('');
          return '<div class="rday"><div class="rdate' + (d.ymd === data.today ? ' today' : '') + '">' + esc(d.label) + (d.ymd === data.today ? '（今日）' : '') + '</div>'
            + '<div class="rticks">' + ticks + '</div>' + rooms + '</div>';
        };
        var first = days.slice(0, 3), rest = days.slice(3);
        html += first.map(dayHtml).join('');
        if (rest.length) html += '<details><summary>' + esc(rest[0].label) + ' 以降（' + rest.length + '日）</summary>' + rest.map(dayHtml).join('') + '</details>';
        html += '<div class="rlegend"><span><i style="background:var(--accent)"></i>レッスン（前後の余白込み）</span><span><i style="background:var(--caution)"></i>レンタル</span><span><i style="background:var(--muted)"></i>その他の予定</span><span><i style="background:var(--ok-soft)"></i>空き</span></div>';
        html += '<p class="hint">' + esc(data.at ? data.at + ' 時点。' : '') + '部屋の名前を押すと予定の一覧が出ます。空いていても、使う前に日置へ一言ください。</p>';
        return html;
      }

      function toggleRoomList(el) {

      }

      /* ---- w11 振替・予約の申請 ---- */
      var REQF = { kind: '振替', reason: '生徒都合', student: '', campus: '', room: '', open: false, msg: '' };

      function cancelReq(id, what) {

      function timeOptions(sel) {
        var out = '';

          var v = ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2);

      function formHtml(data) {
        var groups = data.roomGroups || [];

        var pills = function (name, list, cur) {

        var today = data.today || '';

        var stSel = students.filter(function (s) { return (s.id || s.name) === REQF.student; })[0];
        var lessons = (stSel && stSel.lessons) || [];
        var manual = !lessons.length || REQF.fromOther;
        var fromSel = '<div><label>元のレッスン</label><select id="rq_fromsel" onchange="reqFromPick(this.value)">'
          + lessons.map(function (l, i) { return '<option value="' + esc(l.ymd + '|' + l.hm) + '"' + (i === 0 && !REQF.fromOther ? ' selected' : '') + '>' + esc(l.label) + '</option>'; }).join('')
          + '<option value=""' + (manual ? ' selected' : '') + '>' + (lessons.length ? 'その他の日（下に入れる）' : (stSel ? '予定に無いので下に入れる' : '生徒を選ぶと出ます')) + '</option></select></div>';
        return '<div class="rform" id="rformBody">'
          + '<div><label>種類</label>' + pills('kind', ['振替', '予約'], REQF.kind) + '</div>'
          + '<div><label>生徒</label><select id="rq_student" onchange="reqStudent(this.value)">' + stOpts + '</select>'
          + '<input id="rq_sname" placeholder="生徒の名前" style="margin-top:6px' + (REQF.student === '__other' ? '' : ';display:none') + '"></div>'
          + (isMove ? fromSel + '<div class="inline" id="rq_fromManual"' + (manual ? '' : ' style="display:none"') + '><div><label>元の日</label><input type="date" id="rq_from" value="' + esc(today) + '"></div><div><label>元の時刻</label><select id="rq_fromhm">' + timeOptions(stSel && /^\d{2}:\d{2}$/.test(stSel.time || '') ? stSel.time : '') + '</select></div></div>' : '')
          + '<div><label>希望の日</label><input type="date" id="rq_ymd" value="' + esc(today) + '" min="' + esc(today) + '" onchange="reqFree()"></div>'
          + '<div class="inline"><div><label>校舎</label><select id="rq_campus" onchange="reqCampus(this.value)">' + groups.map(function (x) { return '<option' + (x.campus === REQF.campus ? ' selected' : '') + '>' + esc(x.campus) + '</option>'; }).join('') + '</select></div>'
          + '<div><label>部屋</label><select id="rq_room" onchange="REQF.room=this.value;reqFree()">' + g.rooms.map(function (r) { return '<option' + (r === REQF.room ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') + '</select></div></div>'
          + (data.roomGroupsError ? '<div class="freeinfo ng">' + esc(data.roomGroupsError) + '</div>' : '<div class="freeinfo" id="rq_free"><button type="button" onclick="reqFree()">この日の空きを見る</button></div>')
          + '<div class="inline"><div><label>開始</label><select id="rq_hm">' + timeOptions('') + '</select></div><div><label>長さ</label><select id="rq_min"><option value="30">30分</option><option value="45">45分</option><option value="60">60分</option></select></div></div>'
          + '<div><label>理由</label>' + pills('reason', data.reasons || ['講師都合', '生徒都合', 'その他'], REQF.reason) + '</div>'
          + '<div><label>メモ（日置へ）</label><textarea id="rq_memo" placeholder="例: 運動会の振替です"></textarea></div>'
          + '<button type="button" class="p send" id="rq_send" onclick="sendReq()">申請する</button>'
          + '<div class="sent" id="rq_msg">' + esc(REQF.msg || '') + '</div></div>';
